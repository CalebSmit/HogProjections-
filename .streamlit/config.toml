[browser]
gatherUsageStats = false

[server]
headless = false

[client]
toolbarMode = "minimal"  # hide the developer menu / Deploy button for end users

# Design tokens. Keep in sync with src/hogproj/ui.py (TOKENS) and docs/DESIGN.md.
[theme]
base = "light"
primaryColor = "#1f4e8c"
backgroundColor = "#f6f6f4"
secondaryBackgroundColor = "#eeeeea"
textColor = "#16181d"
borderColor = "#e3e3de"
dataframeBorderColor = "#ecece8"
dataframeHeaderBackgroundColor = "#f8f8f6"
showWidgetBorder = true
showSidebarBorder = true
# Inter from Google Fonts when online; the system UI font (Segoe UI / SF Pro) when offline.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap, 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
baseFontSize = 14
headingFontSizes = ["1.5rem", "1.125rem", "1rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
baseRadius = "0.625rem"
buttonRadius = "0.5rem"
greenColor = "#178a6a"
greenTextColor = "#11704f"
greenBackgroundColor = "#e7f4ef"
redColor = "#c8453a"
redTextColor = "#a8352b"
redBackgroundColor = "#fbecea"
blueColor = "#1f4e8c"
grayColor = "#8b909a"
linkColor = "#1f4e8c"
linkUnderline = false
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f4f4f1"
textColor = "#2b2f36"
borderColor = "#e8e8e3"
