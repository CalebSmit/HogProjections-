[browser]
gatherUsageStats = false

[server]
headless = false

[client]
toolbarMode = "minimal"  # hide the developer menu / Deploy button for end users

# Design tokens. Keep in sync with src/hogproj/ui.py (TOKENS) and docs/DESIGN.md.
[theme]
base = "light"
primaryColor = "#1f5c45"
backgroundColor = "#f7f5f0"
secondaryBackgroundColor = "#efece5"
textColor = "#1d2520"
borderColor = "#e5e0d5"
dataframeBorderColor = "#ebe6dc"
dataframeHeaderBackgroundColor = "#faf8f3"
showWidgetBorder = true
showSidebarBorder = true
# IBM Plex Sans / Source Serif 4 from Google Fonts when online; system UI font offline.
# Font names must not contain digits-as-words (e.g. "Source Sans 3"): Streamlit writes them
# unquoted and the whole font declaration becomes invalid.
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500..700&display=swap, serif"
baseFontSize = 15
headingFontSizes = ["2.05rem", "1.25rem", "1.0625rem", "0.9375rem", "0.875rem", "0.8125rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
greenColor = "#178a6a"
greenTextColor = "#11704f"
greenBackgroundColor = "#e7f4ef"
redColor = "#c8453a"
redTextColor = "#a8352b"
redBackgroundColor = "#fbecea"
blueColor = "#1f5c45"
grayColor = "#7c847e"
linkColor = "#1f5c45"
linkUnderline = false
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f2efe8"
secondaryBackgroundColor = "#ebe7de"
textColor = "#2f3832"
borderColor = "#e5e0d5"
