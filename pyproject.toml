[project]
name = "hogproj"
version = "0.1.0"
description = "Hog production projections and financials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "plotly>=5.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "xlsxwriter>=3.2",
    "pypdf>=6.21.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "formulas>=1.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hogproj"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "app.py", "views"]
typeCheckingMode = "standard"
# pandas ships no type hints; inferring them from its source is order-dependent and flips
# results when unrelated files change. Treat untyped libraries as Any instead.
useLibraryCodeForTypes = false
